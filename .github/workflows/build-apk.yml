name: Build Siesta Sức Khỏe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Project & Arrange Code
        run: |
          flutter create --org com.example.siesta_suc_khoe --platforms=android --project-name=siesta_suc_khoe app_build

          # Tạo các thư mục con trong lib
          mkdir -p app_build/lib/screens app_build/lib/services app_build/lib/providers app_build/lib/theme

          # Tạo các thư mục assets để không bị lỗi pubspec.yaml
          mkdir -p app_build/assets/audio app_build/assets/images
          touch app_build/assets/audio/.gitkeep app_build/assets/images/.gitkeep

          # Copy các file code vào đúng vị trí
          [ -f main.dart ] && cp main.dart app_build/lib/main.dart
          [ -f y2k_theme.dart ] && cp y2k_theme.dart app_build/lib/theme/y2k_theme.dart
          [ -f login_screen.dart ] && cp login_screen.dart app_build/lib/screens/login_screen.dart
          [ -f dashboard_screen.dart ] && cp dashboard_screen.dart app_build/lib/screens/dashboard_screen.dart
          [ -f settings_screen.dart ] && cp settings_screen.dart app_build/lib/screens/settings_screen.dart
          [ -f ai_siesta_service.dart ] && cp ai_siesta_service.dart app_build/lib/services/ai_siesta_service.dart
          [ -f background_service.dart ] && cp background_service.dart app_build/lib/services/background_service.dart
          [ -f soul_battery_provider.dart ] && cp soul_battery_provider.dart app_build/lib/providers/soul_battery_provider.dart
          [ -f pubspec.yaml ] && cp pubspec.yaml app_build/pubspec.yaml
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml

          # Xóa bỏ thuộc tính package thừa trong AndroidManifest.xml
          sed -i 's/package="[^"]*"//g' app_build/android/app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Thêm cấu hình bỏ qua xung đột AAR metadata vào gradle.properties
          cat << 'EOF' >> app_build/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.experimental.checkAarMetadata=false
          android.suppressUnsupportedCompileSdk=36
          EOF

          cd app_build

          # Ghi đè file android/app/build.gradle (Groovy) chuẩn xác
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.example.siesta_suc_khoe"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId = "com.example.siesta_suc_khoe"
                  minSdk = 24
                  targetSdk = 36
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }

          flutter {
              source = '../..'
          }
          EOF

          # Ghi đè file android/app/build.gradle.kts (Kotlin DSL) nếu hệ thống ưu tiên Kotlin
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.siesta_suc_khoe"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.siesta_suc_khoe"
                  minSdk = 24
                  targetSdk = 36
                  versionCode 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Install Dependencies & Patch Plugins
        run: |
          cd app_build
          flutter pub get

          # Tự động nâng compileSdk của tất cả thư viện phụ thuộc (đặc biệt là file_picker) lên Android 36
          find /home/runner/.pub-cache -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g; s/compileSdk = [0-9]*/compileSdk = 36/g; s/compileSdk [0-9]*/compileSdk 36/g' {} + 2>/dev/null || true

      - name: Compile Release APK
        run: |
          cd app_build
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: siesta-suc-khoe-oppo-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
