name: Build Siesta Sức Khỏe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-organize files & create Flutter project skeleton
        run: |
          mkdir -p temp_backup
          cp -r *.dart *.yaml *.gradle *.xml temp_backup/ 2>/dev/null || true

          flutter create --org com.example.siesta_suc_khoe --platforms=android --project-name=siesta_suc_khoe .

          mkdir -p lib/screens lib/services lib/providers lib/theme
          mkdir -p android/app/src/main

          [ -f temp_backup/main.dart ] && cp temp_backup/main.dart lib/main.dart
          [ -f temp_backup/y2k_theme.dart ] && cp temp_backup/y2k_theme.dart lib/theme/y2k_theme.dart
          [ -f temp_backup/login_screen.dart ] && cp temp_backup/login_screen.dart lib/screens/login_screen.dart
          [ -f temp_backup/dashboard_screen.dart ] && cp temp_backup/dashboard_screen.dart lib/screens/dashboard_screen.dart
          [ -f temp_backup/settings_screen.dart ] && cp temp_backup/settings_screen.dart lib/screens/settings_screen.dart
          [ -f temp_backup/ai_siesta_service.dart ] && cp temp_backup/ai_siesta_service.dart lib/services/ai_siesta_service.dart
          [ -f temp_backup/background_service.dart ] && cp temp_backup/background_service.dart lib/services/background_service.dart
          [ -f temp_backup/soul_battery_provider.dart ] && cp temp_backup/soul_battery_provider.dart lib/providers/soul_battery_provider.dart

          [ -f temp_backup/AndroidManifest.xml ] && cp temp_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          [ -f temp_backup/build.gradle ] && cp temp_backup/build.gradle android/app/build.gradle
          [ -f temp_backup/pubspec.yaml ] && cp temp_backup/pubspec.yaml pubspec.yaml

          # Tự động nâng compileSdk lên 35 cho tương thích audioplayers và camera
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk .*/compileSdk 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk .*/targetSdk 35/g' android/app/build.gradle 2>/dev/null || true

          rm -rf temp_backup

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: siesta-suc-khoe-oppo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
