name: Build Siesta Sức Khỏe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Global Gradle Fixes
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
                  tasks.matching { it.name.contains("AarMetadata") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Create Clean Flutter Project & Arrange Code
        run: |
          flutter create --org com.example.siesta_suc_khoe --platforms=android --project-name=siesta_suc_khoe app_build

          mkdir -p app_build/lib/screens app_build/lib/services app_build/lib/providers app_build/lib/theme

          [ -f main.dart ] && cp main.dart app_build/lib/main.dart
          [ -f y2k_theme.dart ] && cp y2k_theme.dart app_build/lib/theme/y2k_theme.dart
          [ -f login_screen.dart ] && cp login_screen.dart app_build/lib/screens/login_screen.dart
          [ -f dashboard_screen.dart ] && cp dashboard_screen.dart app_build/lib/screens/dashboard_screen.dart
          [ -f settings_screen.dart ] && cp settings_screen.dart app_build/lib/screens/settings_screen.dart
          [ -f ai_siesta_service.dart ] && cp ai_siesta_service.dart app_build/lib/services/ai_siesta_service.dart
          [ -f background_service.dart ] && cp background_service.dart app_build/lib/services/background_service.dart
          [ -f soul_battery_provider.dart ] && cp soul_battery_provider.dart app_build/lib/providers/soul_battery_provider.dart
          [ -f pubspec.yaml ] && cp pubspec.yaml app_build/pubspec.yaml
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml

          cd app_build
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle* 2>/dev/null || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle* 2>/dev/null || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle* 2>/dev/null || true

          if [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle
          fi

      - name: Install Dependencies
        run: |
          cd app_build
          flutter pub get

      - name: Compile Release APK
        run: |
          cd app_build
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: siesta-suc-khoe-oppo-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
